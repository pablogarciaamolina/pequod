defaults:
  - engagement: julius_muth
  - angle: curiosity
  - channels: mock
  - strategies: default
  - _self_

run:
  max_iterations: 5     # loop limit
  max_paths: 2          # paths planned per iteration
  max_waves: 3          # waves planned per path
  reply_window_h: 24    # wait after the last send
  command_poll_s: 1     # how often the engine looks for commands from the simulator's buttons
  register: true        # false = keep no record of the run: no trace, messages, snapshots, report, and no texts in main.log

mock_hub: runs/mock_hub.db   # SQLite file shared by the mock channels and `pequod reply`; relative to the start folder

models:
  # num_ctx: Ollama's default context is too small for the agents' tool outputs
  ollama_qwen: {provider: ollama, name: "huihui_ai/qwen3.5-abliterated:4b", params: {num_ctx: 8192, temperature: 0}}
  claude: {provider: anthropic, name: claude-sonnet-5-5}
  hf_qwen_local: {provider: huggingface, name: Qwen/Qwen2.5-1.5B-Instruct, params: {local: true, family: qwen, pipeline_kwargs: {max_new_tokens: 512, do_sample: false}}}

agents:
  strategist: {model: ollama_qwen, max_steps: 4}
  planner: {model: ollama_qwen, max_steps: 4}
  composer: {model: ollama_qwen, max_steps: 4}
  reviewer: {model: ollama_qwen, max_steps: 4}
  updater: {model: ollama_qwen, max_steps: 8}
  resolver: {model: ollama_qwen, max_steps: 4}

hydra:
  run:
    dir: runs/${now:%Y-%m-%d_%H-%M-%S}
  job_logging:
    handlers:
      file: {encoding: utf-8}   # messages can hold any character
