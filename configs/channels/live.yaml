# credentials = names of the env vars that must exist in .env
email:
  mode: live
  credentials: [EMAIL_ADDRESS, EMAIL_APP_PASSWORD]
  rules: {max_length: 2000, subject: true, links_ok: true}
sms:
  mode: live
  credentials: [TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_SMS_FROM]
  rules: {max_length: 160, subject: false, links_ok: true}
whatsapp:
  mode: live
  credentials: [TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM]
  rules: {max_length: 1000, subject: false, links_ok: true}
