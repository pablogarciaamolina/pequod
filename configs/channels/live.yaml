# Our (system) channels on real platforms. Each targets a persona channel of the same platform.
# credentials: what the channel needs -> name of the variable that must be set in .env
pepe:
  platform: email
  target: work_email
  angle: curiosity
  mode: live
  role: ""
  credentials: {user: EMAIL_ADDRESS, password: EMAIL_APP_PASSWORD}
  smtp_host: smtp.gmail.com
  smtp_port: 465
  imap_host: imap.gmail.com
  default_subject: "A quick question"
  timeout_s: 30
  rules: {max_length: 2000, subject: true, links_ok: true}
stephan:
  platform: sms
  target: company_sms
  angle: curiosity
  mode: live
  role: ""
  credentials: {sid: TWILIO_ACCOUNT_SID, token: TWILIO_AUTH_TOKEN, sender: TWILIO_SMS_FROM}
  timeout_s: 30
  rules: {max_length: 160, subject: false, links_ok: true}
melina:
  platform: whatsapp
  target: personal_whatsapp
  angle: curiosity
  mode: live
  role: ""
  credentials: {sid: TWILIO_ACCOUNT_SID, token: TWILIO_AUTH_TOKEN, sender: TWILIO_WHATSAPP_FROM}
  timeout_s: 30
  rules: {max_length: 1000, subject: false, links_ok: true}
