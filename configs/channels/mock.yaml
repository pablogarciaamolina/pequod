# Our (system) channels: the accounts we send from. Each targets one of the persona's channels
# (configs/engagement/*.yaml) and must share its platform. Mock mode routes through the mock hub.
pepe:
  platform: email
  target: work_email          # the persona channel this account writes to (same platform)
  angle: urgency
  mode: mock
  role: "Pepe Salgado from Valladolid FC. Wants the services from Revel8. Has concerns from recent hack threats."
  credentials: {user: "pepe.salgado@valladolidfc.com"}
  rules: {max_length: 2000, subject: true, links_ok: true}
stephan:
  platform: sms
  target: company_sms
  angle: authority
  mode: mock
  role: "Stephan Ilaender. CTO at STACKIT (revel8 hosts its platform on STACKIT). Reaches out needing Julius to take action clicking on a link."
  credentials: {}
  rules: {max_length: 160, subject: false, links_ok: true}
melina:
  platform: whatsapp
  target: personal_whatsapp
  angle: familiarity
  mode: mock
  role: "Melina Garber. From Revel8 (Head of People and Culture). Engages with Julius in an informal manner, but she hasn't text him yet."
  credentials: {}
  rules: {max_length: 1000, subject: false, links_ok: true}
