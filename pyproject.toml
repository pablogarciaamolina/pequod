[project]
name = "pequod"
version = "0.1.0"
description = "Agentic multi-wave, multi-channel client-engagement engine (demo)"
requires-python = ">=3.11,<3.14"  # Hydra 1.3 --help crashes on 3.14 (argparse)
dependencies = [
    "hydra-core",
    "pydantic>=2",
    "langchain>=1.0",
    "langgraph",
    "networkx",
    "langchain-anthropic",
    "langchain-ollama",
    "langchain-openai",
    "langchain-huggingface",
]

[project.scripts]
pequod = "pequod.main:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pequod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
